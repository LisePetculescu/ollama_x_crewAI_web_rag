<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Copenhagen Travel Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="nordic-theme">
    <main class="page">
      <header class="hero">
        <h1>Copenhagen Travel Assistant</h1>
        <p>Ask about attractions, neighbourhoods, transport, food, events, and sustainable ways to explore Copenhagen.</p>
      </header>

      <section class="suggestions-grid">
        <button class="suggestion-card" data-query="Plan a 1-day itinerary for Copenhagen">📅 Plan a 1-day itinerary</button>
        <button class="suggestion-card" data-query="Which neighbourhoods should I visit in Copenhagen?">🏘️ Find neighbourhoods</button>
        <button class="suggestion-card" data-query="Where can I find the best food and cafés in Copenhagen?">☕ Explore food and cafés</button>
        <button class="suggestion-card" data-query="How do I get from the airport to the city center in Copenhagen?">✈️ Transport from the airport</button>
      </section>

      <section class="panel chat-panel">
        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chat-form" class="chat-form">
          <div class="mode-selector-container">
            <label class="input-label">Choose your guide mode:</label>
            <div class="mode-options">
              <label class="mode-option">
                <input type="radio" name="chat-mode" value="rag" checked>
                <span class="mode-label">Quick answer</span>
                <span class="mode-desc">Best for simple questions.</span>
              </label>
              <label class="mode-option">
                <input type="radio" name="chat-mode" value="crew">
                <span class="mode-label">Travel planner</span>
                <span class="mode-desc">Best for itineraries and planning.</span>
              </label>
            </div>
          </div>

          <label class="input-label" for="question">Your Question</label>
          <div class="input-row">
            <textarea id="question" name="question" rows="3" placeholder="Ask for a 1-day itinerary, where to stay, how to get from the airport, or what to eat in Copenhagen..." required></textarea>
            <button id="send-button" type="submit">Ask guide</button>
          </div>
        </form>

        <div class="meta-row">
          <span>Model: <strong id="model-name">{{ default_model }}</strong></span>
          <span>Mode: <code id="current-mode">Quick answer</code></span>
          <span>Route: <code id="current-route">/api/chat/rag</code></span>
        </div>
      </section>
    </main>

    <template id="message-template">
      <article class="message-card">
        <div class="message-role"></div>
        <div class="message-content"></div>
        <div class="message-citations"></div>
        <div class="message-actions"></div>
      </article>
    </template>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
